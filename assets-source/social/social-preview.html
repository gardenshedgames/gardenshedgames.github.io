<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <style>
      @font-face {
        font-family: "Outfit";
        src: url("../../docs/assets/fonts/Outfit-Variable.ttf") format("truetype");
        font-weight: 100 900;
      }

      * { box-sizing: border-box; }

      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }

      body {
        background: #101010;
        color: #f5f5f5;
        font-family: "Outfit", Arial, sans-serif;
      }

      .content { position: relative; z-index: 1; width: 100%; height: 100%; padding: 94px 82px; }
      .eyebrow { margin: 0 0 20px; color: #32a635; font-size: 28px; font-weight: 800; letter-spacing: .17em; text-transform: uppercase; }
      h1 { max-width: 700px; margin: 0 0 24px; font-size: 100px; font-weight: 800; letter-spacing: -.02em; line-height: .92; }
      .supporting-copy { max-width: 670px; margin: 0; color: #d0d0d0; font-size: 32px; font-weight: 500; line-height: 1.3; }
      .logo { position: absolute; right: 82px; bottom: 58px; width: 290px; height: auto; }
    </style>
  </head>
  <body>
    <main class="content">
      <p class="eyebrow">Garden Shed Games</p>
      <h1>Grow Your Games.</h1>
      <p class="supporting-copy">Flexible senior engineering support for game studios and independent developers.</p>
      <img class="logo" src="../../docs/assets/gsg-logo.svg" alt="">
    </main>
  </body>
</html>
