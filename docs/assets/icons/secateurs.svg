<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="120 94 720 812" role="img" aria-labelledby="secateurs-title">
  <title id="secateurs-title">Garden secateurs</title>
  <defs>
    <mask id="clear-hinge" maskUnits="userSpaceOnUse" x="100" y="80" width="790" height="850">
      <rect x="100" y="80" width="790" height="850" fill="white"/>
      <circle cx="550" cy="450" r="66" fill="black"/>
