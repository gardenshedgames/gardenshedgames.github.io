    <path id="shovel" transform="translate(60 0)" fill-rule="evenodd" d="M 1740.37 988.10 L 1937.63 1040.12 Q 1951.16 1043.69 1947.59 1057.23 L 1931.53 1118.15 C 1915.47 1179.06 1859.00 1212.78 1821 1217 L 1696 1689 L 1798 1717 Q 1822 1723 1815 1747 L 1758 1934 C 1731 2009 1648 2036 1578 2016 C 1499 1994 1438 1929 1457 1854 L 1504 1676 Q 1512 1640 1540 1648 L 1630 1672 L 1755 1198 C 1723.63 1177.08 1691.13 1119.90 1707.20 1058.99 L 1723.26 998.07 Q 1726.83 984.53 1740.37 988.10 Z
      M 1766.96 1051.99 L 1882.99 1082.59 Q 1888.79 1084.12 1887.26 1089.92 L 1883.18 1105.40 C 1873.24 1143.11 1835.10 1166.14 1801.26 1157.22 C 1767.42 1148.29 1745.60 1109.45 1755.55 1071.74 L 1759.63 1056.27 Q 1761.16 1050.46 1766.96 1051.99 Z
      M 1624.85 1727.53 Q 1616.16 1725.20 1615.76 1734.41 L 1610.64 1865.55 Q 1609.92 1879.86 1616.44 1867.11 L 1677.58 1753.98 Q 1681.84 1742.80 1673.15 1740.47 Z"/>
    <path id="left-grass" transform="translate(35 0)" d="M 223 2039 C 189 2014 141 2002 129 1944 Q 120 1914 148 1918 C 180 1922 219 1950 248 1979 C 222 1931 173 1868 176 1828 Q 179 1776 221 1792 C 269 1810 298 1880 319 1925 C 319 1890 334 1865 353 1877 C 383 1895 397 1945 393 2005 Z"/>
