<svg xmlns="http://www.w3.org/2000/svg" width="4096" height="4248" viewBox="0 0 2048 2124" role="img" aria-labelledby="title description">
  <title id="title">Garden Shed Games logo</title>
  <desc id="description">A green garden shed, leaning shovel with a rounded triangular blade cutout, and grass on a curved ground line. Transparent background.</desc>
  <defs>
    <!-- A 100-unit outline removes 50 units outside each silhouette. -->
    <mask id="wall-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="2048" height="2124" style="mask-type:luminance">
      <rect width="2048" height="2124" fill="white"/>
      <g fill="black" stroke="black" stroke-width="100" stroke-linejoin="round">
        <use href="#roof"/>
        <use href="#shovel"/>
      </g>
    </mask>
    <clipPath id="below-roof">
      <path d="M 270 780 Q 625 454 1008 140 Q 1385 443 1758 782 L 2048 2124 H 0 Z"/>
    </clipPath>
  </defs>
  <g fill="#218721">
    <!-- Roof: a continuous, softly rounded silhouette. -->
    <path id="roof" d="M 198 694 Q 588 355 981 33 Q 1009 9 1038 33 Q 1447 367 1816 694 Q 1836 712 1821 735 L 1790 778 Q 1776 798 1758 782 Q 1385 443 1008 140 Q 625 454 270 780 Q 250 798 233 780 L 193 733 Q 179 715 198 694 Z"/>
    <!-- Wall ends follow the adjacent silhouettes at a consistent 50-unit gap. -->
    <g clip-path="url(#below-roof)" mask="url(#wall-clearance)">
      <path id="left-wall" d="M 334 550 H 420 C 450 1094 471 1551 474 1987 L 396 1995 C 395 1554 372 1096 334 550 Z"/>
      <path id="right-wall" d="M 1583 550 H 1662 C 1627 1028 1608 1323 1600 1720 L 1527 1720 C 1537 1270 1552 964 1583 550 Z"/>
    </g>
    <path id="door-frame" d="M 663 629 H 1322 Q 1360 629 1360 667 V 1990 H 1282 V 732 Q 1282 709 1259 709 H 726 Q 704 709 704 732 V 1982 H 626 V 667 Q 626 629 663 629 Z"/>
    <rect id="left-plank-seam" x="877" y="709" width="24" height="1268" rx="12"/>
    <rect id="right-plank-seam" x="1083" y="709" width="24" height="1268" rx="12"/>
    <circle id="door-knob" cx="1195" cy="1283" r="55"/>
